<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Checker Application</title>
    <!-- Link to the external CSS file for styling the page -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container for the application -->
    <div class="container">
        <h1>Vowel Checker</h1>
        <!-- Container for the input elements -->
        <div class="input-container">
            <!-- Textarea for user to input text -->
            <textarea id="textInput" placeholder="Enter your text here"></textarea>
            <!-- Button to trigger the checkVowels function -->
            <button onclick="checkVowels()">Count Vowels</button>
        </div>
        <!-- Paragraph to display the result of the vowel count -->
         <!--  -->
        <p id="result">Result</p>
        <!-- Will add an audio , so that when user clicks count vowel button
         the results are displayed above and an audio element says the results
         if its 3 vowels, its says 3, etc
         user can also be able to mute
          -->
           <!-- Audio element to play the vowel count result -->
           <audio id="audio" controls>
            
           </audio>
          <button onclick="toggleMute()">Mute/Unmute</button>

    </div>

    <!-- Link to the external JavaScript file for functionality -->
    <script src="index.js"></script>
</body>
</html>
